name: Sincronizar Projeto Descompactado com o Google Drive

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Instala o rclone de forma oficial pelo Linux
      - name: Instalar rclone no sistema
        run: sudo apt-get update && sudo apt-get install -y rclone

      # Passo 3: Configura e força a sincronização usando o seu Cliente OAuth pessoal
      - name: Sincronizar arquivos soltos com o Google Drive
        run: |
          # 1. Extrai o Client ID e o Client Secret diretamente do seu arquivo JSON do OAuth
          CLIENT_ID=$(jq -r '.installed.client_id // .web.client_id' <<<'${{ secrets.GCP_CREDENTIALS }}')
          CLIENT_SECRET=$(jq -r '.installed.client_secret // .web.client_secret' <<<'${{ secrets.GCP_CREDENTIALS }}')
          
          # 2. Executa a sincronização injetando suas credenciais pessoais para usar seus 15GB grátis
          rclone sync . :drive: \
            --drive-client-id="$CLIENT_ID" \
            --drive-client-secret="$CLIENT_SECRET" \
            --drive-root-folder-id="${{ secrets.DRIVE_FOLDER_ID }}" \
            --exclude ".git/**" \
            --exclude ".github/**" \
            -v
