name: Sincronizar Projeto Descompactado com o Google Drive

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Configura o ambiente Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      # Passo 3: Envia os arquivos soltos simulando seu usuário pessoal
      - name: Enviar arquivos soltos
        uses: tpaschalis/google-drive-upload-action@v1.2.0
        with:
          credentials: ${{ secrets.GCP_CREDENTIALS }}
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
          filename: '.' # Indica que vai ler a pasta atual de forma descompactada
          force: true
