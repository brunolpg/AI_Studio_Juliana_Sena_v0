name: Sincronizar Projeto Descompactado com o Google Drive

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: Instala e configura o rclone de forma oficial
      - name: Configurar ferramenta de sincronização
        uses: rclone/rclone-action@v1

      # Passo 3: Cria o arquivo de conexão usando sua credencial JSON e envia os arquivos soltos
      - name: Sincronizar arquivos soltos com o Google Drive
        run: |
          # Escreve a credencial temporariamente no servidor para autenticação
          echo '${{ secrets.GCP_CREDENTIALS }}' > gdrive_key.json
          
          # Executa a sincronização forçando a cópia arquivo por arquivo descompactado
          rclone sync . :drive: --drive-service-account-file=gdrive_key.json --drive-team-drive="" --drive-root-folder-id="${{ secrets.DRIVE_FOLDER_ID }}" --exclude ".git/**" --exclude ".github/**" -v
